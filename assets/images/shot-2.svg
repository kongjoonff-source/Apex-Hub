    <rect x="90" y="150" width="320" height="330" rx="24" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="440" y="130" width="320" height="370" rx="24" fill="#ffffff" fill-opacity=".07" stroke="url(#g)" stroke-opacity=".7"/>
    <rect x="790" y="150" width="320" height="330" rx="24" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
  <rect x="130" y="190" width="120" height="26" rx="13" fill="#ffffff" fill-opacity=".20"/>
